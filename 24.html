                    setAdState(prev => {
                        const today = getKSTDateString();
                        if (prev.date !== today) {
                             return { date: today, hint: 0, time: 0, pass: 0, energy: 0, revive: 0, [type]: 1 };
                        }
                        return { ...prev, [type]: prev[type] + 1 };
                    });
                    
                    if (type === 'hint') setHintsLeft(p => p + 3);
                    if (type === 'time') setTimeItemsLeft(p => p + 3);
                    if (type === 'pass') setPassItemsLeft(p => p + 3);
                    if (type === 'energy') {
                        setEnergy(p => {
                            const newE = p + 3;
                            localStorage.setItem('make24_energy', newE.toString());
                            return newE;
                        });
                    }
                    
                    // 데일리 미션 업데이트 (광고 보기)
                    updateMission('ads', 1, true);
                    
                }, 1500);
            };

            // 모든 모달창 상태 확인 (모달이 켜져있으면 시간 멈춤)
            const isAnyModalOpen = showSettings || showShop || showMissions || showRanking || showNicknameModal;

            useEffect(() => {
                let timer;
                if (gameState === 'playing' && !isPaused && !isAnyModalOpen) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                SoundEngine.playWrong();
                                const answer = getBestSolution(sourceCards);
                                setSolutionStr(answer);
                                saveRecord(score, streak, solvedCount);
                                setGameState('fail'); 
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [gameState, isPaused, isAnyModalOpen, sourceCards, tutorialPhase, score, streak, solvedCount]);

            const handleSourceCardClick = (card) => {
                if (gameState !== 'playing' && gameState !== 'tutorial') return;
                if (isPaused) return;
                SoundEngine.playClick();
                
                const emptySlotIdx = slots.indexOf(null);
                if (emptySlotIdx !== -1) {
                    const newSlots = [...slots];
                    newSlots[emptySlotIdx] = card;
                    setSlots(newSlots);
                } else {
                    setResultMessage(t('slots_full'));
                    setTimeout(() => setResultMessage(""), 1000);
                }
            };

            const handleSlotCardClick = (index) => {
                if (gameState !== 'playing' && gameState !== 'tutorial') return;
                if (isPaused) return;
                SoundEngine.playClick();
                
                if (slots[index]) {
                    const newSlots = [...slots];
                    newSlots[index] = null;
                    setSlots(newSlots);
                }
            };

            const toggleStartBracket = (idx) => {
                if (gameState !== 'playing' && gameState !== 'tutorial') return;
                if (isPaused) return;
                SoundEngine.playClick();

                if (gameState === 'tutorial' && tutorialPhase >= 1 && tutorialPhase <= 3) {
                    setShake(true);
                    setTimeout(() => setShake(false), 300);
                    return;
                }

                const newBrackets = [...startBrackets];
                newBrackets[idx] = (newBrackets[idx] + 1) % 3;
                setStartBrackets(newBrackets);
            };

            const toggleEndBracket = (idx) => {
                if (gameState !== 'playing' && gameState !== 'tutorial') return;
                if (isPaused) return;
                SoundEngine.playClick();

                if (gameState === 'tutorial' && tutorialPhase >= 1 && tutorialPhase <= 3) {
                    setShake(true);
                    setTimeout(() => setShake(false), 300);
                    return;
                }

                const newBrackets = [...endBrackets];
                newBrackets[idx] = (newBrackets[idx] + 1) % 3;
                setEndBrackets(newBrackets);
            };

            const selectOperator = (idx, op) => {
                if (gameState !== 'playing' && gameState !== 'tutorial') return;
                if (isPaused) return;
                SoundEngine.playClick();
                const newOps = [...operators];
                newOps[idx] = op;
                setOperators(newOps);
                setActiveOpSelector(null);
            };

            const triggerConfetti = () => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
            };

            const calculateScore = (timeTaken, currentStreak) => {
                let basePoints = timeTaken <= 10000 ? 3 : timeTaken <= 20000 ? 2 : 1;
                let multiplier = currentStreak > 50 ? 10 : currentStreak >= 31 ? 8 : currentStreak >= 21 ? 4 : currentStreak >= 10 ? 2 : 1;
                return { base: basePoints, multiplier, total: basePoints * multiplier };
            };

            const checkResult = () => {
                if (slots.some(s => s === null)) {
                    setResultMessage(t('place_cards'));
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    return;
                }

                // --- 튜토리얼 5단계 이중괄호 강제 검증 ---
                if (tutorialPhase === 5) {
                    const usedDoubleBracket = startBrackets.some(b => b >= 2) || endBrackets.some(b => b >= 2);
                    if (!usedDoubleBracket) {
                        setResultMessage(t('tut_force_double'));
                        setShake(true);
                        setTimeout(() => setShake(false), 500);
                        return;
                    }
                }
                // ----------------------------------------

                const cardOptions = slots.map(c => c.value === 1 ? [1, 10] : [c.value]); 
                let possibleValueSets = [[]];
                for (let options of cardOptions) {
                    const next = [];
                    for (let prev of possibleValueSets) {
                        for (let opt of options) { next.push([...prev, opt]); }
                    }
                    possibleValueSets = next;
                }
                let solved = false;
                let winningExpression = "";
                let lastError = null;
                for (let values of possibleValueSets) {
                    let expression = "";
                    for(let i=0; i<4; i++) {
                        if (startBrackets[i] > 0) expression += "(".repeat(startBrackets[i]);
                        expression += values[i];
                        if (endBrackets[i] > 0) expression += ")".repeat(endBrackets[i]);
                        if (i < 3) expression += ` ${operators[i]} `;
                    }
                    try {
                        const result = new Function(`return ${expression}`)();
                        if (Math.abs(result - 24) < 0.0001) {
                            solved = true;
                            let displayExp = "";
                            for(let i=0; i<4; i++) {
                                if (startBrackets[i] > 0) displayExp += "(".repeat(startBrackets[i]);
                                displayExp += values[i];
                                if (endBrackets[i] > 0) displayExp += ")".repeat(endBrackets[i]);
                                if(i < 3) displayExp += ` ${OPERATOR_DISPLAY[operators[i]]} `;
                            }
                            winningExpression = displayExp;
                            break;
                        }
                    } catch (e) { lastError = t('check_brackets'); }
                }

                if (solved) {
                    const now = Date.now();
                    const solveDuration = now - problemStartTime;
                    
                    if (tutorialPhase > 0) {
                        SoundEngine.playCorrect();
                        setGameState('success');
                        setResultMessage(`${t('correct')} (${winningExpression} = 24)`);
                        triggerConfetti();
                        return;
                    }

                    const nextStreak = streak + 1;
                    
                    // 콤보 발생 여부에 따라 사운드 다르게 재생
                    if (nextStreak > 1) {
                        SoundEngine.playCombo(nextStreak);
                    } else {
                        SoundEngine.playCorrect();
                    }

                    const scoreInfo = calculateScore(solveDuration, nextStreak);
                    const newTotalScore = score + scoreInfo.total;
                    const newSolvedCount = solvedCount + 1;
                    
                    setScore(newTotalScore);
                    setGold(prev => prev + 10 + Math.min(nextStreak, 5));
                    
                    saveRecord(newTotalScore, nextStreak, newSolvedCount);
                    
                    // 데일리 미션 업데이트
                    updateMission('combo', nextStreak, false);
                    updateMission('stages', 1, true);
                    updateMission('score', newTotalScore, false);

                    setLastScoreGain(scoreInfo);
                    setStreak(nextStreak);
                    if (nextStreak > 1) {
                        setComboFlash(nextStreak);
                        setTimeout(() => setComboFlash(null), 1200);
                    }

                    setGameState('success');
                    setResultMessage(`${t('correct')} (${winningExpression} = 24)`);
                    triggerConfetti();
                } else {
                    SoundEngine.playWrong();
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    
                    if (tutorialPhase > 0) {
                        setResultMessage(t(`tut_hint_${tutorialPhase}`));
                        return;
                    }

                    // 오답 시 시간 차감 (5초) 및 콤보 초기화
                    if (timeLeft <= 5) {
                        setTimeLeft(0);
                        const answer = getBestSolution(sourceCards);
                        setSolutionStr(answer);
                        setResultMessage(lastError || t('wrong_answer'));
                        saveRecord(score, streak, solvedCount);
                        setGameState('fail'); 
                    } else {
                        setTimeLeft(prev => prev - 5);
                        setStreak(0);
                        setResultMessage(`${lastError || t('wrong_answer')} ⏰ -5s`);
                    }
                }
            };

            const claimMission = (id, reward) => {
                SoundEngine.playClick();
                if (missions.claimed[id]) return;
                setGold(g => g + reward);
                setMissions(prev => ({ ...prev, claimed: { ...prev.claimed, [id]: true } }));
            };

            const claimAll = () => {
                SoundEngine.playClick();
                if (missions.claimed.all) return;
                setGold(g => g + 500);
                setMissions(prev => ({ ...prev, claimed: { ...prev.claimed, all: true } }));
            };

            const missionConfig = [
                { id: 'combo', target: 5, reward: 100, title: t('mission_combo', {n: 5}) },
                { id: 'stages', target: 10, reward: 100, title: t('mission_stages', {n: 10}) },
                { id: 'score', target: 50, reward: 150, title: t('mission_score', {n: 50}) },
                { id: 'ads', target: 3, reward: 150, title: t('mission_ads', {n: 3}) },
                { id: 'play', target: 1, reward: 50, title: t('mission_play', {n: 1}) },
            ];

            const hasClaimableMission = missionConfig.some(m => missions.progress[m.id] >= m.target && !missions.claimed[m.id]) || 
                                        (missionConfig.every(m => missions.claimed[m.id]) && !missions.claimed.all);
            const allClaimed = missionConfig.every(m => missions.claimed[m.id]);

            const deckCardClass = "w-[14vw] max-w-[3.5rem] h-[18vw] max-h-[4.5rem] rounded-xl";
            const slotCardClass = "w-[14vw] max-w-[3.5rem] h-[18vw] max-h-[4.5rem] rounded-xl";

            const sortedRankings = [...allRankings].sort((a, b) => (b[rankingTab] || 0) - (a[rankingTab] || 0)).slice(0, 50);

            const formatRankValue = (rank) => {
                if (rankingTab === 'score') return rank.score ? rank.score.toLocaleString() : '0';
                if (rankingTab === 'combo') return (rank.combo || 0);
                if (rankingTab === 'solved') return (rank.solved || 0);
            };

            return (
                <div className={`flex flex-col h-full bg-slate-900 overflow-hidden relative transition-all duration-300`}>
                    
                    {/* 1. 불타오르는 콤보 화면 이펙트 */}
                    {gameState === 'playing' && streak >= 3 && !isPaused && !isAnyModalOpen && (
                        <div className="absolute inset-0 pointer-events-none z-[45] mix-blend-screen opacity-70">
                            <div 
                                className={`w-full h-full transition-all duration-1000 ${streak >= 8 ? 'animate-pulse' : 'animate-[pulse_3s_ease-in-out_infinite]'}`}
                                style={{
                                    boxShadow: streak >= 8 ? 'inset 0 0 120px 30px rgba(217, 70, 239, 0.5)' : 
                                               streak >= 5 ? 'inset 0 0 90px 20px rgba(239, 68, 68, 0.4)' : 
                                               'inset 0 0 60px 15px rgba(249, 115, 22, 0.3)' 
                                }}
                            />
                        </div>
                    )}

                    {/* 2. 상단 헤더 */}
                    <div className="flex-none px-2 sm:px-4 py-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center z-30 shadow-lg min-h-[70px] sm:min-h-[80px]">
                         <div className="flex items-center gap-2 shrink-0">
                            <div className="flex flex-col items-center justify-center">
                                <span className="text-[10px] text-slate-400 font-bold tracking-widest mb-0.5">{t('solved')}</span>
                                <span className="text-xl sm:text-3xl font-black text-blue-400 leading-none">{tutorialPhase > 0 ? `T${tutorialPhase}` : solvedCount}</span>
                            </div>
                            <div className="flex flex-col items-center justify-center bg-slate-900/80 rounded-xl px-2 sm:px-3 py-1.5 border border-slate-700/50 shadow-inner min-w-[3rem] sm:min-w-[3.5rem]">
                                <div className="flex items-center gap-1 sm:gap-1.5">
                                    <Heart size={14} className="text-rose-500 fill-rose-500 sm:w-[16px] sm:h-[16px]" />
                                    <span className="text-xs sm:text-base font-black text-white leading-none mt-0.5">{energy}</span>
                                </div>
                                {energy < MAX_ENERGY && (
                                    <span className="text-[9px] sm:text-xs text-rose-300 font-mono mt-1 font-bold leading-none tracking-tighter">{formatTime(timeToNextEnergy)}</span>
                                )}
                            </div>
                         </div>
                        <div className="flex-1 flex justify-center items-center gap-1.5 sm:gap-5 px-1">
                            <div className="flex flex-col items-end justify-center relative w-auto min-w-[2rem] sm:min-w-[2.5rem]">
                                <span className="text-[9px] sm:text-[10px] text-slate-400 font-bold tracking-widest mb-0.5 hidden sm:block">{t('score')}</span>
                                <span className="text-lg sm:text-3xl font-black text-yellow-400 leading-none">{score.toLocaleString()}</span>
                                {lastScoreGain && <span className="text-[10px] sm:text-xs font-bold text-emerald-400 animate-score absolute top-6 sm:top-8 right-0 pointer-events-none whitespace-nowrap">+{lastScoreGain.total}</span>}
                            </div>
                            <div className={`flex items-center justify-center gap-1 sm:gap-2 px-2.5 sm:px-4 py-1 sm:py-2 rounded-3xl bg-slate-900 border-2 transition-all duration-300 ${timeLeft <= 10 ? 'border-red-500 text-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]' : 'border-slate-600 text-emerald-400 shadow-inner'}`}>
                                <Timer size={16} className="sm:w-[20px] sm:h-[20px]" />
                                <span className="text-xl sm:text-4xl font-black font-mono tracking-wider w-8 sm:w-16 text-center leading-none mt-0.5">
                                    {tutorialPhase > 0 ? '∞' : timeLeft}
                                </span>
                                {showTimePlusEffect && <span className="absolute text-emerald-400 font-black text-sm sm:text-xl animate-time-plus ml-10 sm:ml-16">+10s</span>}
                            </div>
                            <div className="flex flex-col items-start justify-center w-auto min-w-[2rem] sm:min-w-[2.5rem]">
                                <span className="text-[9px] sm:text-[10px] text-slate-400 font-bold tracking-widest mb-0.5 hidden sm:block">{t('combo')}</span>
                                <div className={`flex items-baseline gap-0.5 font-black ${streak > 0 ? 'text-orange-500' : 'text-slate-600'}`}>
                                    <span className="text-lg sm:text-3xl leading-none">{streak}</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center justify-end shrink-0 gap-1.5 sm:gap-2">
                            {/* 랭킹/일시정지 버튼 */}
                            {gameState === 'start' || gameState === 'tutorial_complete' ? (
                                <button onClick={() => {SoundEngine.playClick(); setShowRanking(true);}} className="p-2.5 sm:p-3 bg-slate-700 active:bg-slate-600 hover:brightness-110 active:opacity-75 rounded-full text-yellow-400 shadow-lg border border-slate-600 transition-all duration-200 active:scale-95">
                                    <Trophy size={18} className="sm:w-[22px] sm:h-[22px]" />
                                </button>
                            ) : (
                                <button onClick={() => {SoundEngine.playClick(); setIsPaused(true);}} className="p-2.5 sm:p-3 bg-slate-700 active:bg-slate-600 hover:brightness-110 active:opacity-75 rounded-full text-white shadow-lg border border-slate-600 transition-all duration-200 active:scale-95">
                                    <Pause size={18} className="sm:w-[22px] sm:h-[22px]" />
                                </button>
                            )}
                            
                            {/* 설정창 버튼 */}
                            <button onClick={() => {
                                SoundEngine.playClick(); 
                                setShowSettings(true);
                            }} className="p-2.5 sm:p-3 bg-slate-700 active:bg-slate-600 hover:brightness-110 active:opacity-75 rounded-full text-slate-300 shadow-lg border border-slate-600 transition-all duration-200 active:scale-95">
                                <SettingsIcon size={18} className="sm:w-[22px] sm:h-[22px]" />
                            </button>
                        </div>
                    </div>

                    {/* 3. 백그라운드 클릭용 오버레이 */}
                    {(activeOpSelector !== null) && (
                        <div className="fixed inset-0 z-[35]" onClick={() => setActiveOpSelector(null)} />
                    )}

                    {/* 4. 메인 게임 영역 */}
                    <div className="flex-1 flex flex-col relative overflow-hidden">
                        
                        {/* 로비 화면 */}
                        {gameState === 'start' ? (
                            <div className={`flex items-center justify-center w-full h-full p-4 relative ${currentLobbyTheme.bgClass} transition-colors duration-500`} style={{background: `linear-gradient(to bottom, ${currentLobbyTheme.gradStart}, ${currentLobbyTheme.gradEnd})`}}>
                                
                                {/* 로비 좌측 상단 닉네임 표시 */}
                                <div 
                                    className={`absolute top-4 left-4 z-50 flex items-center gap-2 bg-slate-900/60 px-3 py-1.5 rounded-full border border-slate-700/50 shadow-sm backdrop-blur-sm animate-pop-scale transition-all duration-200 ${user ? 'cursor-pointer hover:bg-slate-800 active:scale-95 active:opacity-75' : 'cursor-default'}`} 
                                    onClick={() => {
                                        if (user) {
                                            SoundEngine.playClick(); 
                                            setShowNicknameModal(true);
                                        }
                                    }}
                                >
                                    <User size={14} className="text-slate-400" />
                                    <span className="text-xs font-bold text-slate-200">
                                        {nickname}
                                    </span>
                                </div>

                                <div className="w-full max-w-sm text-center space-y-5 bg-slate-800/80 backdrop-blur-sm p-6 rounded-3xl border border-slate-700/50 shadow-2xl relative z-10">
                                    <div className="flex flex-col items-center justify-center gap-2">
                                        <div className="flex justify-center gap-3 mb-2">
                                            <div className={`w-12 h-16 rounded-xl flex flex-col items-center justify-center shadow-lg transform -rotate-12 border-b-4 ${currentDeckStyle.bgClass} ${currentDeckStyle.textClass}`}><span className="text-3xl font-black leading-none">2</span></div>
                                            <div className={`w-12 h-16 rounded-xl flex flex-col items-center justify-center shadow-lg transform rotate-6 z-10 border-b-4 ${currentDeckStyle.bgClass} ${currentDeckStyle.textClass}`}><span className="text-3xl font-black leading-none">4</span></div>
                                        </div>
                                        <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-sm">{t('title')}</h1>
                                    </div>
                                    <p className="text-slate-200 text-xs flex flex-col gap-1 px-4">
                                        <span>{t('subtitle1')}<br/>{t('subtitle2')}</span>
                                        <span className="text-[10px] text-emerald-400 font-bold mt-1 bg-emerald-900/50 py-1 px-2 rounded-full border border-emerald-500/30">{t('a_card_info')}</span>
                                    </p>
                                    <div className="flex flex-col gap-3 w-full pt-1 relative">
                                        
                                        {/* 환영 안내 메시지 */}
                                        {showWelcomeTutorialHook && (
                                            <div className="absolute -top-[4.5rem] left-1/2 -translate-x-1/2 z-[80] w-max max-w-[90vw] pointer-events-none">
                                                <div className="bg-yellow-500 text-slate-900 font-black text-sm py-2 px-4 rounded-2xl shadow-[0_0_20px_rgba(234,179,8,0.6)] border-2 border-yellow-300 flex flex-col items-center whitespace-normal break-keep text-center animate-pop-scale">
                                                    {t('welcome_msg', {name: nickname})}
                                                    <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-t-[8px] border-transparent border-t-yellow-500"></div>
                                                </div>
                                            </div>
                                        )}

                                        <button onClick={startTutorial} className={`w-full py-3 bg-emerald-700/90 backdrop-blur text-white font-bold text-sm rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all duration-200 active:scale-95 active:opacity-75 border border-emerald-500/50 relative hover:brightness-110 ${showWelcomeTutorialHook ? 'animate-pulse ring-4 ring-yellow-400 z-50' : ''}`}>
                                            <CheckCircle size={18} /> {t('tutorial_btn')}
                                        </button>
                                        <button onClick={initGame} className={`w-full py-3.5 text-white font-bold text-lg rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all duration-200 active:scale-95 active:opacity-75 hover:brightness-110 bg-blue-600/90 backdrop-blur border border-blue-500/50`}>
                                            <Play size={20} fill="currentColor" /> {t('game_start')}
                                        </button>
                                    </div>
                                    <div className="flex gap-2 w-full">
                                        <button onClick={() => {SoundEngine.playClick(); setShowShop(true);}} className="flex-1 py-3 bg-indigo-700/80 backdrop-blur hover:brightness-110 active:opacity-75 text-indigo-100 font-bold text-sm rounded-xl shadow flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 transition-all duration-200 active:scale-95 border border-indigo-500/50">
                                            <ShoppingBag size={18} /> <span className="text-xs sm:text-sm">{t('shop')}</span>
                                        </button>
                                        <button onClick={() => {SoundEngine.playClick(); setShowMissions(true);}} className="flex-1 py-3 bg-fuchsia-700/80 backdrop-blur hover:brightness-110 active:opacity-75 text-fuchsia-100 font-bold text-sm rounded-xl shadow flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 transition-all duration-200 active:scale-95 border border-fuchsia-500/50 relative">
                                            <ClipboardList size={18} /> <span className="text-xs sm:text-sm">{t('tab_missions')}</span>
                                            {hasClaimableMission && <span className="absolute top-1 right-2 w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>}
                                        </button>
                                    </div>

                                    {/* 로그인 안내 문구 */}
                                    {!user && (
                                        <div className="mt-2 bg-slate-900/60 border border-slate-700/50 rounded-xl p-3 flex items-center justify-center gap-2 shadow-inner transition-all duration-200">
                                            <User size={16} className="text-slate-400 shrink-0" />
                                            <span className="text-xs text-slate-300 font-medium break-keep leading-snug text-left">
                                                {t('guest_login_prompt')}
                                            </span>
                                        </div>
                                    )}
                                </div>
                                {showWelcomeTutorialHook && <div className="absolute inset-0 bg-black/60 z-[5] pointer-events-none"></div>}
                            </div>
                        ) : (
                            <>
                                {/* 1. 사용할 카드(Deck) 영역 */}
                                <div className={`flex flex-col items-center justify-center py-6 ${currentBoardTheme.bgClass} border-b-4 ${currentBoardTheme.borderClass} relative shadow-[inset_0_-10px_20px_rgba(0,0,0,0.2)] transition-colors duration-500`} style={{background: `linear-gradient(to bottom, ${currentBoardTheme.gradStart}, ${currentBoardTheme.gradEnd})`}}>
                                    {!isPaused && (
                                        <>
                                            {tutorialPhase > 0 ? (
                                                <div className="absolute top-3 left-1/2 transform -translate-x-1/2 bg-yellow-500 text-slate-900 text-xs sm:text-sm font-black px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.5)] z-30 whitespace-nowrap border-2 border-yellow-300">
                                                    {t(`tut_goal_${tutorialPhase}`)}
                                                </div>
                                            ) : (
                                                <div className="absolute top-2 left-4 text-[10px] text-white/50 font-bold uppercase tracking-wider flex items-center gap-2">
                                                    {t('cards_to_use')}
                                                </div>
                                            )}
                                            
                                            <div className="flex items-center justify-center gap-3 md:gap-4 w-full px-4">
                                                {sourceCards.map((card, idx) => {
                                                    const used = isCardUsed(card.id);
                                                    
                                                    // --- 튜토리얼 소스 카드 하일라이트 포커스 로직 추가 ---
                                                    let isCardHighlighted = false;
                                                    if (gameState === 'tutorial') {
                                                        if (tutorialPhase === 1) {
                                                            if (slots[0] === null && card.value === 8) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] === null && card.value === 3 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] === null && card.value === 1 && !used) {
                                                                const firstUnusedA = sourceCards.find(c => c.value === 1 && !slots.some(s => s && s.id === c.id));
                                                                if (firstUnusedA && firstUnusedA.id === card.id) isCardHighlighted = true;
                                                            }
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] !== null && slots[3] === null && card.value === 1 && !used) isCardHighlighted = true;
                                                        } else if (tutorialPhase === 2) {
                                                            if (slots[0] === null && card.value === 6) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] === null && card.value === 4 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] === null && card.value === 1 && !used) {
                                                                const firstUnusedA = sourceCards.find(c => c.value === 1 && !slots.some(s => s && s.id === c.id));
                                                                if (firstUnusedA && firstUnusedA.id === card.id) isCardHighlighted = true;
                                                            }
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] !== null && slots[3] === null && card.value === 1 && !used) isCardHighlighted = true;
                                                        } else if (tutorialPhase === 3) {
                                                            if (slots[0] === null && card.value === 5) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] === null && card.value === 7 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] === null && card.value === 8 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] !== null && slots[3] === null && card.value === 4 && !used) isCardHighlighted = true;
                                                        } else if (tutorialPhase === 4) {
                                                            if (slots[0] === null && card.value === 3) {
                                                                const first3 = sourceCards.find(c => c.value === 3);
                                                                if (first3 && first3.id === card.id) isCardHighlighted = true;
                                                            }
                                                            else if (slots[0] !== null && slots[1] === null && card.value === 5 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] === null && card.value === 3 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] !== null && slots[3] === null && card.value === 1 && !used) isCardHighlighted = true;
                                                        } else if (tutorialPhase === 5) {
                                                            if (slots[0] === null && card.value === 2) {
                                                                const first2 = sourceCards.find(c => c.value === 2);
                                                                if (first2 && first2.id === card.id) isCardHighlighted = true;
                                                            }
                                                            else if (slots[0] !== null && slots[1] === null && card.value === 2 && !used) {
                                                                const remaining2 = sourceCards.filter(c => c.value === 2 && !slots.some(s => s && s.id === c.id));
                                                                if (remaining2.length > 0 && remaining2[0].id === card.id) isCardHighlighted = true;
                                                            }
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] === null && card.value === 3 && !used) isCardHighlighted = true;
                                                            else if (slots[0] !== null && slots[1] !== null && slots[2] !== null && slots[3] === null && card.value === 2 && !used) isCardHighlighted = true;
                                                        }
                                                    }

                                                    return (
                                                        <div key={card.id} className={`transition-all duration-300 ${used ? 'opacity-0 scale-50 pointer-events-none' : 'opacity-100 scale-100 z-20'} ${isCardHighlighted ? 'guide-rect-highlight ring-4 ring-yellow-400' : ''}`}>
                                                            <Card card={card} deckStyle={currentDeckStyle} className={`${deckCardClass} hover:brightness-110 transition-all duration-150 active:scale-95 active:opacity-75`} onClick={() => handleSourceCardClick(card)} />
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className={`absolute -bottom-3 ${currentBoardTheme.textMuted} z-20 ${currentBoardTheme.bgClass} border-2 ${currentBoardTheme.borderClass} rounded-full p-0.5 transition-colors duration-500`}><ArrowDown size={16} /></div>
                                        </>
                                    )}
                                </div>

                                {/* 2. 슬롯 및 연산 영역 */}
                                <div className={`flex-1 flex flex-col items-center justify-center w-full px-1 relative ${currentBoardTheme.bgClass} shadow-[inset_0_10px_20px_rgba(0,0,0,0.3)] transition-colors duration-500`}>
                                    {hintText && (
                                        <div className="absolute -top-4 sm:-top-6 left-1/2 -translate-x-1/2 z-[60]">
                                            <div className="bg-black/80 backdrop-blur-md border border-yellow-400/50 rounded-full px-5 py-2 flex items-center gap-3 shadow-2xl animate-pop-scale">
                                                <span className="text-yellow-400 text-[10px] font-bold uppercase tracking-widest">{t('hint_upper')}</span>
                                                <span className="text-xl font-black font-mono text-white tracking-widest">{hintText}</span>
                                            </div>
                                        </div>
                                    )}

                                    <div className={`flex items-center justify-center gap-1 sm:gap-2 w-full max-w-lg mx-auto ${shake ? 'animate-shake' : ''}`}>
                                        {slots.map((slotCard, idx) => {
                                            // --- 연산 및 괄호 구조 선후 관계 포커싱 검증 변수 수립 ---
                                            const slotsFilled = slots.every(s => s !== null);
                                            const opsReadyPhase4 = operators[0] === '+' && operators[1] === '*' && operators[2] === '*';
                                            const opsReadyPhase5 = operators[0] === '+' && operators[1] === '*' && operators[2] === '*';

                                            let isLeftBracketHighlighted = false;
                                            if (gameState === 'tutorial' && slotsFilled) {
                                                if (tutorialPhase === 4 && opsReadyPhase4 && idx === 0 && startBrackets[0] === 0) isLeftBracketHighlighted = true;
                                                if (tutorialPhase === 5 && opsReadyPhase5 && idx === 0 && startBrackets[0] < 2) isLeftBracketHighlighted = true;
                                            }

                                            let isRightBracketHighlighted = false;
                                            if (gameState === 'tutorial' && slotsFilled) {
                                                if (tutorialPhase === 4 && opsReadyPhase4 && startBrackets[0] >= 1 && idx === 1 && endBrackets[1] === 0) isRightBracketHighlighted = true;
                                                if (tutorialPhase === 5 && opsReadyPhase5 && startBrackets[0] === 2 && idx === 1 && endBrackets[1] === 0) isRightBracketHighlighted = true;
                                                if (tutorialPhase === 5 && opsReadyPhase5 && startBrackets[0] === 2 && endBrackets[1] === 1 && idx === 2 && endBrackets[2] === 0) isRightBracketHighlighted = true;
                                            }

                                            return (
                                                <React.Fragment key={idx}>
                                                    <div className="relative flex items-center justify-center">
                                                        {/* 왼쪽 괄호 */}
                                                        <div 
                                                            onClick={() => toggleStartBracket(idx)} 
                                                            className={`absolute -left-4 sm:-left-5 top-1/2 -translate-y-1/2 z-30 w-8 h-full flex items-center justify-center cursor-pointer select-none transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110 ${startBrackets[idx] > 0 ? 'text-yellow-400 font-black text-4xl sm:text-5xl scale-110' : 'text-white/40 font-bold text-2xl sm:text-3xl'} ${isLeftBracketHighlighted ? 'guide-highlight ring-2 ring-yellow-400' : ''}`}
                                                            style={{ textShadow: startBrackets[idx] > 0 ? '2px 2px 0 #1e293b, -1.5px -1.5px 0 #1e293b, 1.5px -1.5px 0 #1e293b, -1.5px 1.5px 0 #1e293b, 0 4px 8px rgba(0,0,0,0.8)' : '1px 1px 2px rgba(0,0,0,0.8)' }}
                                                        >
                                                            {startBrackets[idx] === 1 ? '(' : startBrackets[idx] === 2 ? '((' : '('}
                                                        </div>
                                                        
                                                        {/* 슬롯 카드 */}
                                                        {slotCard ? <Card card={slotCard} deckStyle={currentDeckStyle} className={`${slotCardClass} hover:brightness-110 transition-all duration-150 active:scale-95 active:opacity-75`} onClick={() => handleSlotCardClick(idx)} /> : <Card isPlaceholder={true} placeholderText={t('empty_slot')} className={slotCardClass} />}

                                                        {/* 오른쪽 괄호 */}
                                                        <div 
                                                            onClick={() => toggleEndBracket(idx)} 
                                                            className={`absolute -right-4 sm:-right-5 top-1/2 -translate-y-1/2 z-30 w-8 h-full flex items-center justify-center cursor-pointer select-none transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110 ${endBrackets[idx] > 0 ? 'text-yellow-400 font-black text-4xl sm:text-5xl scale-110' : 'text-white/40 font-bold text-2xl sm:text-3xl'} ${isRightBracketHighlighted ? 'guide-highlight ring-2 ring-yellow-400' : ''}`}
                                                            style={{ textShadow: endBrackets[idx] > 0 ? '2px 2px 0 #1e293b, -1.5px -1.5px 0 #1e293b, 1.5px -1.5px 0 #1e293b, -1.5px 1.5px 0 #1e293b, 0 4px 8px rgba(0,0,0,0.8)' : '1px 1px 2px rgba(0,0,0,0.8)' }}
                                                        >
                                                            {endBrackets[idx] === 1 ? ')' : endBrackets[idx] === 2 ? '))' : ')'}
                                                        </div>
                                                    </div>

                                                    {/* 연산자 버튼 */}
                                                    {idx < 3 && (
                                                        <div className="relative z-[40] flex flex-col items-center justify-center mx-1 sm:mx-1.5 gap-1">
                                                            {OPERATORS.map(op => {
                                                                // --- 튜토리얼 연산 부호 가이드 포커싱 조건 수립 ---
                                                                let isOpHighlighted = false;
                                                                if (gameState === 'tutorial' && slotsFilled) {
                                                                    if (tutorialPhase === 1 || tutorialPhase === 2) {
                                                                        if (op === '*') {
                                                                            if (idx === 0 && operators[0] !== '*') isOpHighlighted = true;
                                                                            else if (operators[0] === '*' && idx === 1 && operators[1] !== '*') isOpHighlighted = true;
                                                                            else if (operators[0] === '*' && operators[1] === '*' && idx === 2 && operators[2] !== '*') isOpHighlighted = true;
                                                                        }
                                                                    } else if (tutorialPhase === 3) {
                                                                        if (op === '+') {
                                                                            if (idx === 0 && operators[0] !== '+') isOpHighlighted = true;
                                                                            else if (operators[0] === '+' && idx === 1 && operators[1] !== '+') isOpHighlighted = true;
                                                                            else if (operators[0] === '+' && operators[1] === '+' && idx === 2 && operators[2] !== '+') isOpHighlighted = true;
                                                                        }
                                                                    } else if (tutorialPhase === 4 || tutorialPhase === 5) {
                                                                        if (idx === 0 && operators[0] !== '+' && op === '+') isOpHighlighted = true;
                                                                        else if (operators[0] === '+' && idx === 1 && operators[1] !== '*' && op === '*') isOpHighlighted = true;
                                                                        else if (operators[0] === '+' && operators[1] === '*' && idx === 2 && operators[2] !== '*' && op === '*') isOpHighlighted = true;
                                                                    }
                                                                }

                                                                return (
                                                                    <button 
                                                                        key={op}
                                                                        onClick={(e) => { 
                                                                            e.stopPropagation(); 
                                                                            selectOperator(idx, op); 
                                                                        }}
                                                                        className={`w-6 h-6 sm:w-8 sm:h-8 rounded-md flex items-center justify-center font-black text-sm sm:text-base transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110 ${
                                                                            operators[idx] === op 
                                                                            ? OPERATOR_STYLES[op] + ' scale-110 ring-2 ring-white/50 z-10' 
                                                                            : OPERATOR_STYLES_INACTIVE[op] + ' opacity-60 hover:opacity-100'
                                                                        } ${isOpHighlighted ? 'guide-rect-highlight ring-2 ring-yellow-400' : ''}`}
                                                                    >
                                                                        {OPERATOR_DISPLAY[op]}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            );
                                        })}
                                    </div>
                                    
                                    {/* 힌트 및 결과 메시지 출력 + A카드 안내 */}
                                    <div className="mt-6 flex flex-col items-center justify-center px-4">
                                        <div className={`text-center leading-tight min-h-[1.25rem] h-auto mb-2 ${gameState === 'success' ? currentBoardTheme.textSuccess : gameState === 'fail' ? 'text-red-400' : currentBoardTheme.textHint}`}>
                                            {resultMessage ? <span className="text-sm font-bold drop-shadow-md break-keep">{resultMessage}</span> : <span className={`text-xs ${currentBoardTheme.textMuted} font-medium`}>{t('place_cards')}</span>}
                                        </div>
                                        {/* A 카드 튜토리얼 팁 */}
                                        {gameState === 'tutorial' && sourceCards.some(c => c.value === 1) && (
                                            <div className="mt-1 px-3 py-1 bg-emerald-900/60 border border-emerald-500/50 rounded-full text-emerald-300 text-[10px] sm:text-xs font-bold animate-pulse">
                                                💡 {t('a_card_info')}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 3. 하단 액션 & 아이템 바 */}
                                <div className={`flex flex-col gap-4 p-4 pb-8 pt-4 ${currentBoardTheme.bgClass} border-t ${currentBoardTheme.borderHalfClass} transition-colors duration-500`}>
                                    {/* 아이템 버튼 */}
                                    {(gameState === 'playing' || gameState === 'tutorial') && !isPaused && (
                                        <div className="flex justify-center gap-6 sm:gap-8 w-full max-w-sm mx-auto mb-2">
                                            <button onClick={useTimeItem} disabled={timeItemsLeft === 0} className="flex flex-col items-center group transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110">
                                                <div className={`w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center rounded-2xl border-2 shadow-lg transition-colors ${timeItemsLeft > 0 ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-700/50 border-slate-600 text-slate-500'}`}>
                                                    <ClockPlus size={28} />
                                                </div>
                                                <div className="mt-2 text-center leading-tight">
                                                    <span className="text-xs font-bold text-slate-300 block mb-0.5">{t('time')}</span>
                                                    <span className={`text-lg font-black ${timeItemsLeft > 0 ? 'text-indigo-300' : 'text-slate-500'}`}>{timeItemsLeft}</span>
                                                </div>
                                            </button>
                                            <button onClick={useHint} disabled={hintsLeft === 0} className="flex flex-col items-center group transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110">
                                                <div className={`w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center rounded-2xl border-2 shadow-lg transition-colors ${hintsLeft > 0 ? 'bg-yellow-600 border-yellow-400 text-white' : 'bg-slate-700/50 border-slate-600 text-slate-500'}`}>
                                                    <Lightbulb size={28} />
                                                </div>
                                                <div className="mt-2 text-center leading-tight">
                                                    <span className="text-xs font-bold text-slate-300 block mb-0.5">{t('hint')}</span>
                                                    <span className={`text-lg font-black ${hintsLeft > 0 ? 'text-yellow-300' : 'text-slate-500'}`}>{hintsLeft}</span>
                                                </div>
                                            </button>
                                            <button onClick={usePassItem} disabled={passItemsLeft === 0} className="flex flex-col items-center group transition-all duration-150 active:scale-90 active:opacity-50 hover:brightness-110">
                                                <div className={`w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center rounded-2xl border-2 shadow-lg transition-colors ${passItemsLeft > 0 ? 'bg-rose-600 border-rose-400 text-white' : 'bg-slate-700/50 border-slate-600 text-slate-500'}`}>
                                                    <FastForward size={28} />
                                                </div>
                                                <div className="mt-2 text-center leading-tight">
                                                    <span className="text-xs font-bold text-slate-300 block mb-0.5">{t('pass')}</span>
                                                    <span className={`text-lg font-black ${passItemsLeft > 0 ? 'text-rose-300' : 'text-slate-500'}`}>{passItemsLeft}</span>
                                                </div>
                                            </button>
                                        </div>
                                    )}

                                    {/* 확인/다음 버튼 */}
                                    <div className="flex justify-center w-full max-w-sm mx-auto">
                                        {(gameState === 'playing' || gameState === 'tutorial') ? (() => {
                                            // --- 정답 확인 버튼 하일라이트 포커스 분석 ---
                                            let isCheckBtnHighlighted = false;
                                            if (gameState === 'tutorial') {
                                                const slotsFilled = slots.every(s => s !== null);
                                                if (tutorialPhase === 1 || tutorialPhase === 2) {
                                                    if (slotsFilled && operators.every(op => op === '*')) isCheckBtnHighlighted = true;
                                                } else if (tutorialPhase === 3) {
                                                    if (slotsFilled && operators.every(op => op === '+')) isCheckBtnHighlighted = true;
                                                } else if (tutorialPhase === 4) {
                                                    if (slotsFilled && operators[0] === '+' && operators[1] === '*' && operators[2] === '*' && startBrackets[0] === 1 && endBrackets[1] === 1) isCheckBtnHighlighted = true;
                                                } else if (tutorialPhase === 5) {
                                                    if (slotsFilled && operators[0] === '+' && operators[1] === '*' && operators[2] === '*' && startBrackets[0] === 2 && endBrackets[1] === 1 && endBrackets[2] === 1) isCheckBtnHighlighted = true;
                                                }
                                            }

                                            return (
                                                <button onClick={checkResult} disabled={isPaused} className={`w-full py-3.5 ${currentBoardTheme.btnBg} hover:brightness-110 active:opacity-75 disabled:opacity-50 text-white font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-2 border ${currentBoardTheme.btnBorder} transition-all duration-200 active:scale-95 ${isCheckBtnHighlighted ? 'guide-rect-highlight ring-4 ring-yellow-400 font-black scale-105' : ''}`}>
                                                    <CheckCircle size={20} /> {t('check_answer')}
                                                </button>
                                            );
                                        })() : null}
                                        
                                        {gameState === 'success' && (
                                            <button onClick={nextProblem} className="w-full py-3.5 bg-blue-600 hover:brightness-110 active:opacity-75 text-white font-bold text-lg rounded-2xl shadow-xl animate-bounce flex items-center justify-center gap-2 transition-all duration-200 active:scale-95">
                                                {tutorialPhase > 0 ? (tutorialPhase === 5 ? t('tutorial_complete') : t('next_problem')) : t('next_problem')} <Play size={20} fill="currentColor" />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    {/* 5. 게임 오버레이/팝업 영역 */}

                    {/* --- 튜토리얼 0단계: 환영인사 및 규칙 명시 오버레이 팝업 기획 추가 --- */}
                    {gameState === 'tutorial' && tutorialPhase === 0 && (
                        <div className="absolute inset-0 z-[90] bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center animate-pop-scale">
                            <div className="bg-slate-800 border-2 border-blue-500 rounded-3xl p-6 max-w-sm shadow-2xl w-full space-y-5">
                                <div className="flex justify-center gap-2">
                                    <div className="w-10 h-14 rounded-lg bg-white text-slate-900 font-black flex items-center justify-center text-xl shadow-md">2</div>
                                    <div className="w-10 h-14 rounded-lg bg-white text-slate-900 font-black flex items-center justify-center text-xl shadow-md">4</div>
                                </div>
                                <h2 className="text-2xl font-black text-blue-400">환영합니다! 🎉</h2>
                                <p className="text-sm text-slate-200 leading-relaxed break-keep px-2">
                                    이 게임은 <span className="text-yellow-400 font-black">4개의 숫자</span>와 <span className="text-yellow-400 font-black">사칙연산 부호</span>를 <span className="text-rose-400 font-black underline underline-offset-4">'모두'</span> 활용해서 <span className="text-emerald-400 font-black">24</span>를 만드는 게임입니다.
                                </p>
                                <button 
                                    onClick={() => {
                                        SoundEngine.playClick();
                                        setTutorialPhase(1);
                                        setProblemStartTime(Date.now());
                                    }} 
                                    className="w-full py-3.5 bg-blue-600 hover:brightness-110 active:opacity-75 text-white font-bold text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-95"
                                >
                                    튜토리얼 시작하기 <Play size={16} fill="currentColor" />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 시간이 10초 이하일 때 나타나는 레드 얼럿 효과 */}
                    {gameState === 'playing' && timeLeft <= 10 && !isPaused && !isAnyModalOpen && <div className="absolute inset-0 pointer-events-none z-[60] animate-red-alert" />}
                    
                    {/* A 카드 등장 안내 토스트 */}
                    {showACardToast && (
                        <div className="absolute top-[28%] left-1/2 -translate-x-1/2 z-[70] pointer-events-none w-max max-w-[90vw]">
                            <div className={`${currentBoardTheme.toastBg} border-2 ${currentBoardTheme.toastBorder} text-white rounded-2xl p-4 shadow-2xl flex items-center justify-center gap-3 backdrop-blur-md animate-pop-scale`}>
                                <div className={`bg-white ${currentBoardTheme.toastText} rounded-lg w-10 h-12 flex items-center justify-center font-black text-2xl shrink-0 shadow-inner`}>
                                    A
                                </div>
                                <div className="font-bold text-sm leading-snug whitespace-nowrap">
                                    {t('a_card_toast')}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 행동력 부족 안내 토스트 */}
                    {showEnergyToast && (
                        <div className="absolute top-[10%] left-1/2 -translate-x-1/2 z-[100] pointer-events-none w-max max-w-[90vw]">
                            <div className="bg-rose-600/95 border-2 border-rose-400 text-white rounded-2xl px-6 py-4 shadow-2xl flex items-center justify-center gap-3 backdrop-blur-md animate-pop-scale">
                                <Heart size={24} className="fill-white animate-pulse shrink-0" />
                                <div className="font-bold text-sm leading-snug whitespace-nowrap">
                                    {t('energy_shortage_toast')}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* 튜토리얼 완료 모달 */}
                    {gameState === 'tutorial_complete' && (
                        <div className="absolute inset-0 z-[80] bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center animate-pop-scale">
                            <div className="bg-slate-800 border-2 border-emerald-500 rounded-3xl p-8 max-w-sm shadow-2xl w-full">
                                <h2 className="text-2xl font-black text-emerald-400 mb-4">{t('tutorial_complete')}</h2>
                                <p className="text-base text-slate-200 mb-8 leading-relaxed">{t('tutorial_done_desc1')}<br/><b>{t('tutorial_done_desc2')}</b></p>
                                <button onClick={goToLobby} className="w-full py-3 bg-blue-600 hover:brightness-110 active:opacity-75 text-white font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-95">
                                    <Home size={20} fill="currentColor" /> {t('goto_lobby')}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 게임 실패(시간오버/오답) 모달 */}
                    {gameState === 'fail' && (
                        <div className="absolute inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4 animate-pop-scale">

                                    <div className="w-full bg-slate-900/80 rounded-2xl p-4 shadow-inner border border-slate-700">
                                        <div className="text-xs text-slate-400 mb-2 font-bold">{t('too_bad')}</div>
                                        <div className="text-2xl font-mono font-black text-yellow-400 tracking-wider mb-1 drop-shadow-md">{solutionStr}</div>

                                    </div>
                                ) : (
                                    <div className="w-full bg-slate-900/80 rounded-2xl p-4 shadow-inner text-slate-300 font-bold border border-slate-700">

                                    </div>

                                    <button 
                                        onClick={reviveGame} 
                                        disabled={(adState.revive || 0) >= 3 || adCooldowns.revive > 0}
                                        className={`w-full py-3.5 font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-95 active:opacity-75 hover:brightness-110 ${((adState.revive || 0) >= 3 || adCooldowns.revive > 0) ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 text-white'}`}
                                    >
                                        <VideoIcon size={20} className={((adState.revive || 0) >= 3 || adCooldowns.revive > 0) ? "text-slate-500" : "text-indigo-200"} /> 
                                        {t('revive_ad')} {adCooldowns.revive > 0 ? `(${adCooldowns.revive}s)` : `(${3 - (adState.revive || 0)}/3)`}

                                        <button onClick={restartGame} className="flex-1 py-3.5 bg-slate-700 hover:brightness-110 active:opacity-75 text-white font-bold text-sm rounded-xl shadow-lg flex items-center justify-center gap-2 border border-slate-600 transition-all duration-200 active:scale-95">
                                            <RotateCcw size={18} /> {t('restart')}
                                        </button>
                                        <button onClick={goToLobby} className="flex-1 py-3.5 bg-rose-700 hover:brightness-110 active:opacity-75 text-white font-bold text-sm rounded-xl shadow-lg flex items-center justify-center gap-2 border border-rose-600 transition-all duration-200 active:scale-95">
                                            <Home size={18} /> {t('exit_lobby')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 게임 일시정지 모달 */}
                    {isPaused && (
                        <div className="absolute inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center gap-8 animate-pop-scale p-4">

                            <div className="flex flex-col gap-4 w-full max-w-xs">
                                <button onClick={() => {SoundEngine.playClick(); setIsPaused(false);}} className="w-full py-3.5 bg-blue-600 hover:brightness-110 active:opacity-75 text-white font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-3 transition-all duration-200 active:scale-95">
                                    <Play size={20} fill="currentColor" /> {t('continue')}
                                </button>
                                <button onClick={restartGame} className={`w-full py-3.5 bg-slate-700 hover:brightness-110 active:opacity-75 text-white font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-3 border border-slate-600 transition-all duration-200 active:scale-95`}>
                                    <RotateCcw size={20} /> {t('restart')}
                                </button>
                                <button onClick={goToLobby} className="w-full py-3.5 bg-rose-700 hover:brightness-110 active:opacity-75 text-white font-bold text-lg rounded-2xl shadow-xl flex items-center justify-center gap-3 border border-rose-600 transition-all duration-200 active:scale-95">
                                    <Home size={20} /> {t('exit_lobby')}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 데일리 미션 모달 */}
                    {showMissions && (
                        <div className="absolute inset-0 z-[80] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4 animate-pop-scale">
                            <div className="w-full max-w-sm bg-slate-800 rounded-3xl shadow-2xl border border-slate-600 flex flex-col max-h-[85vh]">
                                <div className="p-4 border-b border-slate-700 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <ClipboardList className="text-fuchsia-400" size={20} />
                                        <h2 className="text-lg font-bold">{t('tab_missions')}</h2>
                                    </div>
                                    <button onClick={() => {SoundEngine.playClick(); setShowMissions(false);}} className="text-slate-400 p-1 hover:text-white transition-colors duration-150 active:scale-90"><CloseIcon size={20} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {missionConfig.map(m => {
                                        const progress = Math.min(missions.progress[m.id], m.target);
                                        const isComplete = progress >= m.target;
                                        const isClaimed = missions.claimed[m.id];
                                        return (
                                            <div key={m.id} className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center transition-all h-[76px]">
                                                <div className="flex-1 pr-3">
                                                    <div className="font-bold text-sm text-slate-100">{m.title}</div>
                                                    <div className="flex items-center justify-between mt-1">
                                                        <span className="text-[10px] text-slate-400 font-mono">{progress} / {m.target}</span>
                                                        <span className="text-[10px] text-yellow-400 flex items-center gap-0.5"><Coins size={10}/> {m.reward}</span>
                                                    </div>
                                                    <div className="w-full bg-slate-800 rounded-full h-1.5 mt-1.5">
                                                        <div className="bg-emerald-500 h-1.5 rounded-full transition-all duration-500" style={{ width: `${(progress / m.target) * 100}%` }}></div>
                                                    </div>

                                                <div className="shrink-0">
                                                    {isClaimed ? (
                                                        <button disabled className="px-3 py-1.5 bg-slate-800/50 text-slate-500 border border-slate-600/50 rounded-lg font-bold text-xs cursor-default">
                                                            {t('claimed')}
                                                        </button>
                                                    ) : isComplete ? (
                                                        <button onClick={() => claimMission(m.id, m.reward)} className="px-4 py-1.5 bg-yellow-600 text-white rounded-lg font-bold text-xs shadow-md transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110 animate-pulse">
                                                            {t('claim')}
                                                        </button>
                                                    ) : (
                                                        <button disabled className="px-3 py-1.5 bg-slate-600 text-slate-400 rounded-lg font-bold text-xs cursor-not-allowed">
                                                            {t('claim')}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t border-slate-700 bg-slate-800/80 rounded-b-3xl">

                                        <div>
                                            <div className="font-black text-sm text-fuchsia-300">{t('mission_all')}</div>
                                            <div className="text-xs text-yellow-400 font-bold flex items-center gap-1 mt-1"><Coins size={12}/> 500 G</div>
                                        </div>
                                        <button 
                                            onClick={claimAll} 
                                            disabled={!allClaimed || missions.claimed.all}

                                        >
                                            {missions.claimed.all ? t('claimed') : t('claim')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 상점 모달 */}

                                <div className="p-4 border-b border-slate-700 flex justify-between items-center shrink-0">

                                    <button onClick={() => {SoundEngine.playClick(); setShowShop(false);}} className="text-slate-400 p-1 transition-colors hover:text-white active:scale-90"><CloseIcon size={20} /></button>
                                </div>
                                
                                <div className="p-3 bg-slate-900/50 flex justify-center items-center border-b border-slate-700 shrink-0">

                                </div>

                                    <button onClick={() => {SoundEngine.playClick(); setShopTab('boards');}} className={`flex-1 py-3 text-[10px] sm:text-xs font-bold text-center transition-all duration-150 active:bg-slate-600 active:opacity-50 ${shopTab === 'boards' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-700/50' : 'text-slate-400 hover:text-slate-200'}`}>{t('tab_boards')}</button>
                                    <button onClick={() => {SoundEngine.playClick(); setShopTab('lobbies');}} className={`flex-1 py-3 text-[10px] sm:text-xs font-bold text-center transition-all duration-150 active:bg-slate-600 active:opacity-50 ${shopTab === 'lobbies' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-700/50' : 'text-slate-400 hover:text-slate-200'}`}>{t('tab_lobbies')}</button>
