                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {shopTab === 'items' ? (
                                        <>
                                            <div className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className="p-2.5 bg-rose-500 rounded-lg"><Heart size={20} className="text-white fill-white"/></div>
                                                    <div><div className="font-bold text-sm">{t('energy_x3')}</div><div className="text-[10px] text-slate-400">{t('get_by_ad')}</div></div>
                                                </div>
                                                <div className="flex items-center gap-1.5 sm:gap-2">
                                                    <button onClick={() => watchAd('energy')} disabled={adState.energy >= 5 || adCooldowns.energy > 0} className={`px-4 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1.5 transition-all duration-150 ${adState.energy < 5 && adCooldowns.energy === 0 ? 'bg-blue-600 text-white shadow-md active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}>
                                                        <VideoIcon size={14} className={adState.energy < 5 && adCooldowns.energy === 0 ? "text-blue-200" : "text-slate-400"} /> 
                                                        {adCooldowns.energy > 0 ? `${adCooldowns.energy}${t('wait_sec')}` : `${5 - adState.energy}/5`}
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className="p-2.5 bg-yellow-600 rounded-lg"><Lightbulb size={20} className="text-white"/></div>
                                                    <div><div className="font-bold text-sm">{t('hint_x3')}</div><div className="text-[10px] text-slate-400">{t('hint_desc')}</div></div>
                                                </div>
                                                <div className="flex items-center gap-1.5 sm:gap-2">
                                                    <button onClick={() => watchAd('hint')} disabled={adState.hint >= 3 || adCooldowns.hint > 0} className={`px-2 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 ${adState.hint < 3 && adCooldowns.hint === 0 ? 'bg-blue-600 text-white shadow-md active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}>
                                                        <VideoIcon size={14} className={adState.hint < 3 && adCooldowns.hint === 0 ? "text-blue-200" : "text-slate-400"} /> 
                                                        {adCooldowns.hint > 0 ? `${adCooldowns.hint}s` : `${3 - adState.hint}/3`}
                                                    </button>
                                                    <button onClick={() => buyItem('hint', 100)} className="px-2 py-1.5 bg-slate-600 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 shadow-md active:scale-95 active:opacity-50 hover:brightness-110">
                                                        <Coins size={12} className="text-yellow-400" /> 100
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className="p-2.5 bg-indigo-600 rounded-lg"><ClockPlus size={20} className="text-white"/></div>
                                                    <div><div className="font-bold text-sm">{t('time_x3')}</div><div className="text-[10px] text-slate-400">{t('time_desc')}</div></div>
                                                </div>
                                                <div className="flex items-center gap-1.5 sm:gap-2">
                                                    <button onClick={() => watchAd('time')} disabled={adState.time >= 3 || adCooldowns.time > 0} className={`px-2 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 ${adState.time < 3 && adCooldowns.time === 0 ? 'bg-blue-600 text-white shadow-md active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}>
                                                        <VideoIcon size={14} className={adState.time < 3 && adCooldowns.time === 0 ? "text-blue-200" : "text-slate-400"} /> 
                                                        {adCooldowns.time > 0 ? `${adCooldowns.time}s` : `${3 - adState.time}/3`}
                                                    </button>
                                                    <button onClick={() => buyItem('time', 150)} className="px-2 py-1.5 bg-slate-600 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 shadow-md active:scale-95 active:opacity-50 hover:brightness-110">
                                                        <Coins size={12} className="text-yellow-400" /> 150
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className="p-2.5 bg-rose-600 rounded-lg"><FastForward size={20} className="text-white"/></div>
                                                    <div><div className="font-bold text-sm">{t('pass_x3')}</div><div className="text-[10px] text-slate-400">{t('pass_desc')}</div></div>
                                                </div>
                                                <div className="flex items-center gap-1.5 sm:gap-2">
                                                    <button onClick={() => watchAd('pass')} disabled={adState.pass >= 3 || adCooldowns.pass > 0} className={`px-2 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 ${adState.pass < 3 && adCooldowns.pass === 0 ? 'bg-blue-600 text-white shadow-md active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}>
                                                        <VideoIcon size={14} className={adState.pass < 3 && adCooldowns.pass === 0 ? "text-blue-200" : "text-slate-400"} /> 
                                                        {adCooldowns.pass > 0 ? `${adCooldowns.pass}s` : `${3 - adState.pass}/3`}
                                                    </button>
                                                    <button onClick={() => buyItem('pass', 200)} className="px-2 py-1.5 bg-slate-600 rounded-lg font-bold text-xs flex items-center gap-1 transition-all duration-150 shadow-md active:scale-95 active:opacity-50 hover:brightness-110">
                                                        <Coins size={12} className="text-yellow-400" /> 200
                                                    </button>
                                                </div>
                                            </div>
                                        </>
                                    ) : shopTab === 'decks' ? (
                                        CARD_DECKS.map(deck => (
                                            <div key={deck.id} className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-14 flex items-center justify-center rounded border-b-2 shadow-sm font-black text-lg ${deck.bgClass} ${deck.textClass}`}>
                                                        A
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-100">{t(`deck_${deck.id}`)}</div>
                                                        {deck.price > 0 && !ownedDecks.includes(deck.id) && (
                                                            <div className="text-[10px] text-slate-400 mt-0.5">{deck.price.toLocaleString()} G</div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div>
                                                    {equippedDeck === deck.id ? (
                                                        <button disabled className="px-3 py-1.5 bg-emerald-800/50 text-emerald-400 border border-emerald-600/50 rounded-lg font-bold text-xs cursor-default">
                                                            <CheckCircle size={14} className="inline mr-1" />{t('equipped')}
                                                        </button>
                                                    ) : ownedDecks.includes(deck.id) ? (
                                                        <button onClick={() => {SoundEngine.playClick(); setEquippedDeck(deck.id);}} className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-md transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110">
                                                            {t('equip')}
                                                        </button>
                                                    ) : (
                                                        <button 
                                                            onClick={() => handleBuyDeck(deck.id, deck.price)} 
                                                            disabled={gold < deck.price} 
                                                            className={`px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md transition-all duration-150 ${gold >= deck.price ? 'bg-yellow-600 text-white active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}
                                                        >
                                                            <Coins size={12} className={gold >= deck.price ? "text-yellow-200" : "text-slate-400"} /> {deck.price.toLocaleString()}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    ) : shopTab === 'boards' ? (
                                        BOARD_THEMES.map(board => (
                                            <div key={board.id} className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded shadow-sm ${board.previewClass} border-2 ${board.borderClass}`}></div>
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-100">{t(`board_${board.id}`)}</div>
                                                        {board.price > 0 && !ownedBoards.includes(board.id) && (
                                                            <div className="text-[10px] text-slate-400 mt-0.5">{board.price.toLocaleString()} G</div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div>
                                                    {equippedBoard === board.id ? (
                                                        <button disabled className="px-3 py-1.5 bg-emerald-800/50 text-emerald-400 border border-emerald-600/50 rounded-lg font-bold text-xs cursor-default">
                                                            <CheckCircle size={14} className="inline mr-1" />{t('equipped')}
                                                        </button>
                                                    ) : ownedBoards.includes(board.id) ? (
                                                        <button onClick={() => {SoundEngine.playClick(); setEquippedBoard(board.id);}} className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-md transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110">
                                                            {t('equip')}
                                                        </button>
                                                    ) : (
                                                        <button 
                                                            onClick={() => handleBuyBoard(board.id, board.price)} 
                                                            disabled={gold < board.price} 
                                                            className={`px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md transition-all duration-150 ${gold >= board.price ? 'bg-yellow-600 text-white active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}
                                                        >
                                                            <Coins size={12} className={gold >= board.price ? "text-yellow-200" : "text-slate-400"} /> {board.price.toLocaleString()}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        LOBBY_THEMES.map(lobby => (
                                            <div key={lobby.id} className="bg-slate-700/50 rounded-xl p-3 flex justify-between items-center h-[84px] transition-all">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded shadow-sm ${lobby.previewClass} border-2 ${lobby.borderClass}`}></div>
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-100">{t(`board_${lobby.id}`)}</div>
                                                        {lobby.price > 0 && !ownedLobbies.includes(lobby.id) && (
                                                            <div className="text-[10px] text-slate-400 mt-0.5">{lobby.price.toLocaleString()} G</div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div>
                                                    {equippedLobby === lobby.id ? (
                                                        <button disabled className="px-3 py-1.5 bg-emerald-800/50 text-emerald-400 border border-emerald-600/50 rounded-lg font-bold text-xs cursor-default">
                                                            <CheckCircle size={14} className="inline mr-1" />{t('equipped')}
                                                        </button>
                                                    ) : ownedLobbies.includes(lobby.id) ? (
                                                        <button onClick={() => {SoundEngine.playClick(); setEquippedLobby(lobby.id);}} className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-md transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110">
                                                            {t('equip')}
                                                        </button>
                                                    ) : (
                                                        <button 
                                                            onClick={() => handleBuyLobby(lobby.id, lobby.price)} 
                                                            disabled={gold < lobby.price} 
                                                            className={`px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md transition-all duration-150 ${gold >= lobby.price ? 'bg-yellow-600 text-white active:scale-95 active:opacity-50 hover:brightness-110' : 'bg-slate-600 text-slate-400 cursor-not-allowed'}`}
                                                        >
                                                            <Coins size={12} className={gold >= lobby.price ? "text-yellow-200" : "text-slate-400"} /> {lobby.price.toLocaleString()}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                            
                            {/* 광고 시청 중 오버레이 */}
                            {isWatchingAd && (
                                <div className="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center text-white">
                                    <div className="flex flex-col items-center justify-center animate-pop-scale">
                                        <VideoIcon size={64} className="animate-pulse mb-6 text-blue-400" />
                                        <div className="text-2xl font-black">{t('watching_ad')}</div>
                                        <div className="text-base text-slate-400 mt-2 font-bold">{t('please_wait')}</div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* 랭킹 모달 */}
                    {showRanking && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onClick={() => setShowRanking(false)}>
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl border border-slate-600 flex flex-col h-[75vh]" onClick={e => e.stopPropagation()}>
                                <div className="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-800 rounded-t-2xl">
                                    <div className="flex items-center gap-2"><Trophy className="text-yellow-400" size={18} /><h2 className="text-lg font-bold">{t('ranking')}</h2></div>
                                    <button onClick={() => {SoundEngine.playClick(); setShowRanking(false);}} className="text-slate-400 p-1 transition-colors hover:text-white hover:scale-110 active:scale-90"><CloseIcon size={20} /></button>
                                </div>
                                <div className="p-3 bg-slate-750 border-b border-slate-700">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <User size={18} className="text-blue-400" />
                                            <span className="font-bold text-sm text-slate-200">{nickname}</span>
                                            {!user && (
                                                <span className="text-[10px] text-slate-400 ml-1 font-medium tracking-tight">
                                                    {t('guest_ranking_notice')}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex border-b border-slate-700 bg-slate-800">
                                    <button onClick={() => {SoundEngine.playClick(); setRankingTab('score');}} className={`flex-1 py-3 text-xs font-bold text-center transition-all duration-150 active:bg-slate-600 active:opacity-50 ${rankingTab === 'score' ? 'text-yellow-400 border-b-2 border-yellow-400 bg-slate-700/50' : 'text-slate-400 hover:text-slate-200'}`}>{t('tab_score')}</button>
                                    <button onClick={() => {SoundEngine.playClick(); setRankingTab('combo');}} className={`flex-1 py-3 text-xs font-bold text-center transition-all duration-150 active:bg-slate-600 active:opacity-50 ${rankingTab === 'combo' ? 'text-yellow-400 border-b-2 border-yellow-400 bg-slate-700/50' : 'text-slate-400 hover:text-slate-200'}`}>{t('tab_combo')}</button>
                                    <button onClick={() => {SoundEngine.playClick(); setRankingTab('solved');}} className={`flex-1 py-3 text-xs font-bold text-center transition-all duration-150 active:bg-slate-600 active:opacity-50 ${rankingTab === 'solved' ? 'text-yellow-400 border-b-2 border-yellow-400 bg-slate-700/50' : 'text-slate-400 hover:text-slate-200'}`}>{t('tab_solved')}</button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                                    {sortedRankings.length === 0 ? <div className="text-center text-xs text-slate-500 py-4">{t('loading')}</div> : sortedRankings.map((rank, idx) => {
                                        const isActiveUser = (user && rank.userId === user.uid);
                                        return (
                                            <div key={idx} className={`flex justify-between items-center p-2 rounded-lg ${isActiveUser ? 'bg-blue-900/40 border border-blue-500/30' : 'bg-slate-700/30'}`}>
                                                <div className="flex items-center gap-2">
                                                    <span className={`font-black w-5 text-center text-xs ${idx < 3 ? 'text-yellow-400' : 'text-slate-500'}`}>{idx + 1}</span>
                                                    <div className="flex flex-col">
                                                        <span className="text-xs font-medium text-slate-200">{rank.nickname}</span>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-sm text-yellow-400">{formatRankValue(rank)}</div>
                                                    <div className="text-[9px] text-slate-400 font-mono tracking-wider mt-0.5">
                                                        {rankingTab === 'score' ? t('pts') : rankingTab === 'combo' ? 'COMBO' : 'SOLVED'}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 초기 닉네임 설정 모달 */}
                    {showNicknameModal && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center p-4">
                            <div className="bg-slate-800 w-full max-w-xs rounded-3xl shadow-2xl border border-blue-500/50 p-6 flex flex-col items-center text-center animate-pop-scale">
                                <div className="bg-blue-900/50 p-4 rounded-full mb-4 shadow-inner">
                                    <User size={40} className="text-blue-400" />
                                </div>
                                <h2 className="text-2xl font-black text-white mb-2">{t('create_nickname_title')}</h2>
                                <p className="text-xs text-slate-400 mb-6 leading-relaxed whitespace-pre-wrap">
                                    {t('create_nickname_desc')}
                                </p>
                                <input 
                                    type="text" 
                                    value={tempName} 
                                    onChange={(e) => {
                                        setTempName(e.target.value.replace(/[^a-zA-Z0-9]/g, ''));
                                        setNicknameError('');
                                    }} 
                                    placeholder={t('nickname_placeholder')}
                                    className="w-full bg-slate-900 border-2 border-slate-700 rounded-xl px-4 py-3 text-white font-bold mb-2 focus:outline-none focus:border-blue-500 text-center transition-colors"
                                    maxLength={8} 
                                    autoFocus
                                />
                                {nicknameError && (
                                    <div className="text-red-400 text-xs font-bold mb-4 animate-shake">{nicknameError}</div>
                                )}
                                {!nicknameError && <div className="mb-4"></div>}
                                <div className="flex gap-2 w-full">
                                    <button 
                                        onClick={() => setShowNicknameModal(false)}
                                        className={`flex-1 py-3.5 rounded-xl font-bold text-white shadow-lg transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110 bg-slate-700 flex items-center justify-center`}
                                    >
                                        {t('close')}
                                    </button>
                                    <button 
                                        onClick={updateNickname}
                                        disabled={tempName.trim().length === 0}
                                        className={`flex-[2] py-3.5 rounded-xl font-bold text-white shadow-lg transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110 flex items-center justify-center gap-2 ${tempName.trim().length > 0 ? 'bg-blue-600' : 'bg-slate-700 opacity-50 cursor-not-allowed'}`}
                                    >
                                        <CheckCircle size={20} /> {t('confirm')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 설정 모달창 */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center p-4 animate-pop-scale">
                            <div className="w-full max-w-sm bg-slate-800 rounded-3xl shadow-2xl border border-slate-600 flex flex-col">
                                <div className="p-4 border-b border-slate-700 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <SettingsIcon className="text-slate-300" size={20} />
                                        <h2 className="text-lg font-bold text-white">{t('settings')}</h2>
                                    </div>
                                    <button onClick={() => {SoundEngine.playClick(); setShowSettings(false);}} className="text-slate-400 p-1 transition-colors hover:text-white hover:scale-110 active:scale-90"><CloseIcon size={20} /></button>
                                </div>
                                
                                <div className="p-5 space-y-6">
                                    {/* 언어 설정 */}
                                    <div>
                                        <h3 className="text-sm font-bold text-slate-400 mb-3 flex items-center gap-2">{t('language')}</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['ko', 'en', 'ja', 'zh-TW'].map(l => (
                                                <button 
                                                    key={l}
                                                    onClick={() => handleLanguageChange(l)}
                                                    className={`py-2.5 rounded-xl text-sm font-bold border transition-all duration-150 active:scale-95 active:opacity-50 hover:brightness-110 shadow-sm ${language === l ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-700 text-slate-300 border-slate-600'}`}
                                                >
                                                    {l === 'ko' ? '한국어' : l === 'en' ? 'English' : l === 'ja' ? '日本語' : '繁體中文'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 사운드 설정 */}
                                    <div>
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-sm font-bold text-slate-400 flex items-center gap-2">{t('sound')}</h3>
                                            <label className="flex items-center gap-2 cursor-pointer transition-all duration-150 active:scale-95 active:opacity-50">
                                                <span className="text-xs text-slate-300 font-bold select-none">{t('mute_all')}</span>
                                                <div className={`w-10 h-5 relative flex items-center rounded-full transition-colors ${isMuted ? 'bg-rose-500' : 'bg-slate-600'}`}>
                                                    <div className={`absolute left-1 bg-white w-3 h-3 rounded-full shadow-md transform transition-transform ${isMuted ? 'translate-x-5' : 'translate-x-0'}`}></div>
                                                </div>
                                                <input type="checkbox" checked={isMuted} onChange={toggleSound} className="hidden" />
                                            </label>
                                        </div>
                                        <div className={`space-y-5 bg-slate-750 p-4 rounded-2xl border border-slate-700/50 transition-all ${isMuted ? 'opacity-40 pointer-events-none' : ''}`}>
                                            <div className="flex items-center gap-3">
                                                <span className="w-16 text-xs font-bold text-slate-300 whitespace-nowrap">{t('master_vol')}</span>
                                                <input type="range" min="0" max="100" value={volumes.master} onChange={(e) => handleVolumeChange('master', parseInt(e.target.value))} onMouseUp={() => SoundEngine.playClick()} onTouchEnd={() => SoundEngine.playClick()} className="flex-1 h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                                <span className="w-8 text-right text-xs font-mono text-slate-400">{volumes.master}</span>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="w-16 text-xs font-bold text-slate-300 whitespace-nowrap">{t('bgm_vol')}</span>
                                                <input type="range" min="0" max="100" value={volumes.bgm} onChange={(e) => handleVolumeChange('bgm', parseInt(e.target.value))} className="flex-1 h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                                <span className="w-8 text-right text-xs font-mono text-slate-400">{volumes.bgm}</span>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="w-16 text-xs font-bold text-slate-300 whitespace-nowrap">{t('sfx_vol')}</span>
                                                <input type="range" min="0" max="100" value={volumes.sfx} onChange={(e) => handleVolumeChange('sfx', parseInt(e.target.value))} onMouseUp={() => SoundEngine.playClick()} onTouchEnd={() => SoundEngine.playClick()} className="flex-1 h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                                                <span className="w-8 text-right text-xs font-mono text-slate-400">{volumes.sfx}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 콤보 달성 중앙 이펙트 */}
                    {comboFlash && (() => {
                        let exclamation = "!";
                        let flameColor = "text-orange-500";
                        let glowColor = "rgba(251, 146, 60, 0.8)";
                        let gradient = "from-yellow-300 via-orange-500 to-red-600";
                        
                        if (comboFlash >= 8) {
                            exclamation = "!!!";
                            flameColor = "text-fuchsia-500";
                            glowColor = "rgba(217, 70, 239, 0.9)";
                            gradient = "from-pink-300 via-fuchsia-500 to-purple-600";
                        } else if (comboFlash >= 5) {
                            exclamation = "!!";
                            flameColor = "text-red-500";
                            glowColor = "rgba(239, 68, 68, 0.8)";
                            gradient = "from-orange-300 via-red-500 to-rose-700";
                        }

                        let bonusAdded = 0;
                        if (comboFlash >= 8) bonusAdded = 2;
                        else if (comboFlash >= 3) bonusAdded = 1;

                        return (
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[70] pointer-events-none animate-big-combo flex flex-col items-center justify-center whitespace-nowrap w-full">
                                <div className="text-[8rem] leading-none drop-shadow-2xl filter" style={{ textShadow: `0 0 30px ${glowColor}` }}>
                                    <Fire size={100} className={`${flameColor} inline-block mb-2 animate-pulse`} fill="currentColor" />
                                </div>
                                <div className={`text-6xl font-black italic text-transparent bg-clip-text bg-gradient-to-b ${gradient} drop-shadow-lg tracking-tighter`} style={{ textShadow: '3px 3px 0px rgba(0,0,0,0.5)' }}>
                                    {comboFlash} COMBO{exclamation}
                                </div>
                                {bonusAdded > 0 && (
                                    <div className="text-2xl font-black text-emerald-400 mt-2 drop-shadow-md animate-bounce" style={{ textShadow: '2px 2px 0px rgba(0,0,0,0.8)' }}>
                                        ⏰ {t('time_bonus', {sec: bonusAdded})}
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Make24Game />);
    </script>
</body>
</html>
